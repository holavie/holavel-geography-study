<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Geography Study</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <div><h1>Geography Study</h1><div class="sub" id="sub">国内観光地理（2026-09-24 国内試験対策）</div>
  <!-- 共通ホームはローカル環境だけにあるので、既定は非表示。app.js がローカルと判定したときだけ出す -->
  <a class="homelink" id="homeLink" href="../travel-study/home.html" hidden>← Travel Study ホーム</a></div>
  <div class="modes" id="modes"><button data-view="cards" class="on">暗記カード</button><button data-view="quiz">クイズ</button><button data-view="rapid">高速暗記</button><button data-view="nmap">全国MAP</button></div>
  <div class="status" id="status"></div>
</header>
<main class="wrap">
  <section class="filters" id="filters">
    <label>学習分類 <select id="fRegion"><option value="">すべて</option></select></label>
    <label>都道府県 <select id="fPref"><option value="">すべて</option></select></label>
    <label>カテゴリ <select id="fCat"><option value="">すべて</option></select></label>
    <label>優先度 <select id="fPri"><option value="">すべて</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></label>
    <label class="chk"><input type="checkbox" id="fWrong" /> 誤答履歴あり</label>
    <label>検索 <input type="search" id="fSearch" placeholder="資源名・よみ・都道府県・市町村" /></label>
    <span class="count" id="count"></span>
  </section>
  <section id="view"></section>
</main>
<details class="related">
  <summary>過去問・他科目（公式サイトへ移動します）</summary>
  <p>Holavel はここに問題文・解答・解説を持ちません。各試験の実施団体が公開している公式ページを開きます。</p>
  <div class="rl2">
    <a href="https://www.anta.or.jp/exam/shiken/kakomon.html" target="_blank" rel="noopener noreferrer">国内旅行業務取扱管理者試験（ANTA 公式）↗</a>
    <a href="https://www.jata-net.or.jp/seminar/" target="_blank" rel="noopener noreferrer">総合旅行業務取扱管理者試験（JATA 公式）↗</a>
  </div>
  <p>国内＝法令／約款／国内旅行実務。総合＝法令／約款／国内旅行実務／海外旅行実務。</p>
  <!-- 既定は公開向けの文言。ローカル環境のときだけ app.js が連携済みの案内へ差し替える -->
  <p id="pxStatus">Holavel 内での過去問演習との連携は準備中です（この画面からは利用できません）。</p>
</details>
<div class="toast" id="toast"></div>
<script src="data/resources.js"></script>
<script src="data/broad_shallow.js"></script>
<script src="map/locator.js"></script>
<script src="data/visual_assets.js"></script>
<script src="data/visual_locations.js"></script>
<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
